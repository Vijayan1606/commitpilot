name: commitpilot

services:
  web:
    build: .
    image: commitpilot-ai:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      COMMITPILOT_WORKSPACE_ROOT: /workspace
      COMMITPILOT_DATA_DIR: /data
    volumes:
      - ./.workspaces:/workspace
      - commitpilot-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    build: .
    image: commitpilot-ai:local
    restart: unless-stopped
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/mcp/http.ts"]
    ports:
      - "127.0.0.1:4319:4319"
    env_file:
      - .env
    environment:
      COMMITPILOT_WORKSPACE_ROOT: /workspace
      COMMITPILOT_DATA_DIR: /data
      COMMITPILOT_MCP_HOST: 0.0.0.0
    volumes:
      - ./.workspaces:/workspace
      - commitpilot-data:/data

volumes:
  commitpilot-data: